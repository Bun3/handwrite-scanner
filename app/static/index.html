<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>handwrite-scanner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><b>handwrite-scanner</b>
  <a class="on" href="/">작업</a><a href="template.html">템플릿</a>
  <span id="llm" class="hint"></span>
</header>
<main>
<div class="warn" id="updBanner" style="display:none">
  🔔 새 버전 <b id="updVer"></b>이 나왔습니다.
  <a id="updLink" target="_blank" rel="noopener">다운로드 페이지 열기</a> —
  받은 zip을 기존 폴더에 덮어쓰면 모델·작업 기록은 그대로 유지됩니다.
</div>
<div class="card">
  <h3>문서 사진 업로드</h3>
  <div class="warn" id="tplHint" style="display:none">
    템플릿 없이도 인식되지만, <a href="template.html">템플릿을 등록</a>하면 인식률이 크게 올라갑니다.
  </div>
  <form id="up">
    <input type="file" name="files" multiple accept="image/*,.pdf" required>
    <select name="template" id="tplSel"><option value="">(자동 판별)</option></select>
    <button>인식 시작</button>
  </form>
  <p class="hint">CPU에서 문서 1장당 몇 분 걸립니다. 여러 장을 걸어두고 나중에 검수하세요.</p>
  <button class="secondary" onclick="phoneStart()">📱 폰으로 촬영 업로드</button>
  <div id="phoneBox" style="display:none; margin-top:14px; text-align:center">
    <p>같은 Wi-Fi에서 휴대폰 카메라로 QR을 찍어 접속하세요.<br>
    <span class="hint">이 창을 닫으면 연결이 다시 차단됩니다. (최초 1회 방화벽 허용 필요)</span></p>
    <img id="phoneQr" width="220" height="220" alt="QR">
    <p class="hint" id="phoneUrl"></p>
    <button class="danger" onclick="phoneStop()">폰 업로드 끄기</button>
  </div>
</div>
<div class="card">
  <h3>작업 목록</h3>
  <table id="jobs"><tr><th>ID</th><th>템플릿</th><th>상태</th><th>진행</th><th></th></tr></table>
</div>
</main>
<script>
async function j(u, o) { const r = await fetch(u, o); return r.json(); }

async function loadTpl() {
  const tpls = await j('/api/templates');
  document.getElementById('tplHint').style.display = tpls.length ? 'none' : '';
  const sel = document.getElementById('tplSel');
  for (const t of tpls) sel.add(new Option(t.name, t.name));
}

async function refresh() {
  const jobs = await j('/api/jobs');
  const tb = document.getElementById('jobs');
  tb.innerHTML = '<tr><th>ID</th><th>템플릿</th><th>상태</th><th>진행</th><th></th></tr>';
  for (const s of jobs) {
    const tr = tb.insertRow();
    tr.innerHTML = `<td>${s.id}</td><td>${s.template || '-'}</td>
      <td><span class="badge ${s.state}">${s.state}</span></td>
      <td>${s.progress || (s.error ? '오류' : '')}</td>
      <td>${s.state === 'done' ? `<a href="review.html?id=${s.id}">검수/다운로드</a>` : ''}</td>`;
  }
}

document.getElementById('up').onsubmit = async e => {
  e.preventDefault();
  await fetch('/api/jobs', { method: 'POST', body: new FormData(e.target) });
  e.target.reset(); refresh();
};

async function health() {
  const h = await j('/api/health');
  document.getElementById('llm').textContent = h.llm ? '엔진: 준비됨' : '엔진: 로딩 중(첫 작업 시 자동 기동)';
}

async function phoneStart() {
  const d = await j('/api/phone/start', { method: 'POST' });
  document.getElementById('phoneQr').src = d.qr;
  document.getElementById('phoneUrl').textContent = d.url;
  document.getElementById('phoneBox').style.display = '';
}

async function phoneStop() {
  await fetch('/api/phone/stop', { method: 'POST' });
  document.getElementById('phoneBox').style.display = 'none';
}

async function updateCheck() {
  const u = await j('/api/update');
  if (u.available) {
    document.getElementById('updVer').textContent = 'v' + u.latest;
    document.getElementById('updLink').href = u.url;
    document.getElementById('updBanner').style.display = '';
  }
}

loadTpl(); refresh(); health(); setInterval(refresh, 3000);
setTimeout(updateCheck, 3000);
</script>
</body>
</html>
