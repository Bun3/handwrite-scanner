<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>템플릿 편집 - handwrite-scanner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
<script src="feedback.js"></script>
<script src="diagnostics.js"></script>
<script src="view-state.js"></script>
<script src="help.js" defer></script>
</head>
<body>
<header><b>handwrite-scanner</b>
  <a href="/">작업</a><a class="on" href="template.html">템플릿</a>
  <a href="transfer.html">자료 이동</a>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="라이트/다크 전환">☾</button>
</header>
<main>
<div class="card">
  <h3>템플릿</h3>
  <select id="tplSel"><option value="">(새 템플릿)</option></select>
  <input id="tplName" placeholder="템플릿 이름">
  <input type="file" id="refFile" accept="image/*,.pdf">
  <button onclick="createTpl()">기준 양식 등록</button>
  <button class="danger" onclick="delTpl()">삭제</button>
  <p class="hint">빈 양식 이미지나 PDF를 등록한 뒤, 이미지 위에 드래그로 필드 영역을 그리세요.</p>
</div>
<div class="card" id="editor" style="display:none">
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
  <h3>필드 목록
    <button class="secondary" id="adBtn" onclick="autoDetect()" style="font-size:13px">✨ 자동 필드 감지 (베타)</button>
  </h3>
  <table id="fields"><tr><th>라벨</th><th>타입</th><th>후보 목록 (줄바꿈 구분)</th><th>추가 지시(선택)</th><th></th></tr></table>
  <h3>검증 규칙 <span class="hint" style="font-weight:400">(선택 — 줄바꿈 구분, 필드 라벨을 변수로 쓰는 산술·비교식.
    예: <code>종료시간 >= 시작시간</code>. <code>라벨 = 식</code> 형태는 빈 값을 식으로 채우고, 값이 있으면 등식을 검증합니다)</span></h3>
  <textarea id="rules" rows="2" style="width:100%" placeholder="위반 시 관련 필드가 검수에서 강조됩니다"></textarea>
  <br><br><button onclick="saveTpl()">저장</button>
  <button class="secondary" id="discardDraft" onclick="discardTemplateDraft()" hidden>임시 변경 버리기</button>
  <span id="saved" class="hint"></span>
</div>
</main>
<script>
let name = '', fields = [], img = new Image(), scale = 1, drag = null;
let templateBaseline = '', templateReady = false, draftStored = true;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

async function j(u, o) { const r = await apiFetch(u, o); return r.json(); }
// 라벨·후보 등 사용자 입력을 innerHTML 속성/내용에 넣기 전 이스케이프
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function loadList() {
  const sel = document.getElementById('tplSel');
  sel.length = 1;
  for (const t of await j('/api/templates')) sel.add(new Option(t.name, t.name));
  const q = new URLSearchParams(location.search).get('name') || viewState.read('templateLast');
  if (q && [...sel.options].some(o => o.value === q)) { sel.value = q; await openTpl(q); }
}

document.getElementById('tplSel').onchange = e => {
  if (e.target.value) openTpl(e.target.value);
  else {
    storeTemplateDraft();
    if (!draftStored) { e.target.value = name; return; }
    name = ''; templateReady = false;
    viewState.remove('templateLast'); document.getElementById('editor').style.display = 'none';
  }
};

function templateContents() {
  return {fields, rules: document.getElementById('rules').value.split('\n').map(s => s.trim()).filter(Boolean)};
}
function storeTemplateDraft() {
  if (!templateReady || !name) return;
  const content = templateContents();
  if (JSON.stringify(content) === templateBaseline) {
    viewState.remove('templateDraft:' + name); draftStored = true;
    document.getElementById('discardDraft').hidden = true; return;
  }
  document.getElementById('discardDraft').hidden = false;
  draftStored = viewState.write('templateDraft:' + name, content);
  document.getElementById('saved').textContent = draftStored ? '미저장 변경 · 이 탭에 임시 보관됨' : '미저장 변경 · 화면 이동 전 저장하세요';
}
document.getElementById('editor').addEventListener('input', storeTemplateDraft);
document.getElementById('editor').addEventListener('change', storeTemplateDraft);
window.addEventListener('pagehide', storeTemplateDraft);
window.addEventListener('beforeunload', e => {
  storeTemplateDraft();
  if (!draftStored) { e.preventDefault(); e.returnValue = ''; }
});

function discardTemplateDraft() {
  if (!confirm('미저장 변경을 버리고 마지막으로 저장한 양식으로 돌아갈까요?')) return;
  viewState.remove('templateDraft:' + name); templateReady = false;
  openTpl(name);
}

async function createTpl() {
  const n = document.getElementById('tplName').value.trim();
  const f = document.getElementById('refFile').files[0];
  if (!n || !f) return notify('이름과 기준 양식 파일을 입력하세요');
  const fd = new FormData(); fd.append('name', n); fd.append('file', f);
  await apiFetch('/api/templates', { method: 'POST', body: fd });
  await loadList(); document.getElementById('tplSel').value = n; openTpl(n);
}

async function openTpl(n) {
  storeTemplateDraft();
  if (!draftStored && templateReady) {
    document.getElementById('tplSel').value = name;
    notify('편집 내용을 임시 보관하지 못했습니다. 먼저 저장한 뒤 다른 양식을 선택하세요.'); return;
  }
  templateReady = false;
  name = n;
  viewState.write('templateLast', n);
  document.getElementById('editor').style.display = 'none';
  const tpls = await j('/api/templates');
  if (name !== n) return;
  const tpl = tpls.find(t => t.name === n) || {};
  templateBaseline = JSON.stringify({fields: tpl.fields || [], rules: tpl.rules || []});
  const savedDraft = viewState.read('templateDraft:' + n);
  const draft = Array.isArray(savedDraft?.fields) && Array.isArray(savedDraft?.rules) ? savedDraft : null;
  fields = draft ? draft.fields : (tpl.fields || []);
  document.getElementById('rules').value = (draft ? draft.rules : (tpl.rules || [])).join('\n');
  document.getElementById('saved').textContent = draft ? '미저장 편집 내용을 복원했습니다. 반영하려면 저장하세요.' : '';
  const loaded = await loadImage(`/api/templates/${encodeURIComponent(n)}/reference?` + Date.now());
  if (name !== n) return;
  img = loaded;
  scale = Math.min(1, 950 / img.width);
  cv.width = img.width * scale; cv.height = img.height * scale;
  document.getElementById('editor').style.display = '';
  templateReady = true;
  draw(); renderFields();
}

function draw() {
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  ctx.font = '13px sans-serif';
  fields.forEach((f, i) => {
    const [x, y, w, h] = f.box.map(v => v * scale);
    ctx.strokeStyle = '#e5322c'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#e5322c'; ctx.fillText(`${i + 1} ${f.label}`, x + 3, y - 4);
  });
  if (drag) {
    ctx.strokeStyle = '#2c7be5';
    ctx.strokeRect(drag.x, drag.y, drag.w, drag.h);
  }
}

cv.onmousedown = e => {
  const r = cv.getBoundingClientRect();
  drag = { x: e.clientX - r.left, y: e.clientY - r.top, w: 0, h: 0 };
};
cv.onmousemove = e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect();
  drag.w = e.clientX - r.left - drag.x; drag.h = e.clientY - r.top - drag.y;
  draw();
};
cv.onmouseup = () => {
  if (drag && Math.abs(drag.w) > 8 && Math.abs(drag.h) > 8) {
    const x = Math.min(drag.x, drag.x + drag.w) / scale,
          y = Math.min(drag.y, drag.y + drag.h) / scale;
    fields.push({ id: 'f' + Date.now(), label: '필드' + (fields.length + 1),
      type: 'text', box: [Math.round(x), Math.round(y),
        Math.round(Math.abs(drag.w) / scale), Math.round(Math.abs(drag.h) / scale)],
      candidates: [] });
    renderFields();
  }
  drag = null; draw();
};

const TYPES = { text: '자유텍스트', candidates: '후보목록', phone: '전화번호', number: '숫자', time: '시각(9 또는 9:00)', circle: '표시 선택(동그라미·체크 등)' };

let dragIdx = null;  // 행 드래그로 순서 변경 (순서 = 검수 표시·내보내기 컬럼 순서)

function renderFields() {
  const tb = document.getElementById('fields');
  tb.innerHTML = '<tr><th></th><th>라벨</th><th>타입</th><th>후보 목록 (줄바꿈 구분)</th><th>추가 지시(선택)</th><th></th></tr>';
  fields.forEach((f, i) => {
    const tr = tb.insertRow();
    tr.innerHTML = `<td class="grab" title="드래그로 순서 변경">⠿</td>
      <td><input value="${esc(f.label)}" oninput="fields[${i}].label=this.value;draw()"></td>
      <td><select onchange="fields[${i}].type=this.value;renderFields()">${Object.entries(TYPES).map(([k, v]) =>
        `<option value="${k}" ${f.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select><br>
        <label class="hint" style="white-space:nowrap"><input type="checkbox" ${f.optional ? 'checked' : ''}
          onchange="fields[${i}].optional=this.checked"> 비어있어도 정상</label></td>
      <td><textarea rows="1" style="width:100%" placeholder="후보목록/동그라미 타입만"
        oninput="fields[${i}].candidates=this.value.split('\\n').map(s=>s.trim()).filter(Boolean)">${esc((f.candidates || []).join('\n'))}</textarea></td>
      <td><textarea rows="1" style="width:100%" placeholder="모델에게 줄 추가 설명"
        oninput="fields[${i}].hint=this.value.trim()">${esc(f.hint || '')}</textarea>
        ${['number', 'time'].includes(f.type) ? `<div class="hint">범위:
          <input type="number" style="width:60px" value="${f.min ?? ''}" placeholder="min"
            oninput="fields[${i}].min=this.value===''?undefined:+this.value">~
          <input type="number" style="width:60px" value="${f.max ?? ''}" placeholder="max"
            oninput="fields[${i}].max=this.value===''?undefined:+this.value"></div>` : ''}</td>
      <td><button class="danger" onclick="fields.splice(${i},1);renderFields()">삭제</button></td>`;
    tr.querySelector('.grab').onmousedown = () => tr.draggable = true;
    tr.ondragstart = e => { dragIdx = i; e.dataTransfer.effectAllowed = 'move'; };
    tr.ondragend = () => { tr.draggable = false; dragIdx = null; };
    tr.ondragover = e => { e.preventDefault(); tr.style.outline = '2px solid var(--accent)'; };
    tr.ondragleave = () => tr.style.outline = '';
    tr.ondrop = e => {
      e.preventDefault();
      if (dragIdx === null || dragIdx === i) { tr.style.outline = ''; return; }
      const [m] = fields.splice(dragIdx, 1);
      fields.splice(i, 0, m);
      renderFields();
    };
  });
  draw();
  storeTemplateDraft();
}

async function autoDetect() {
  if (fields.length && !confirm('기존 필드 목록을 감지 결과로 대체합니다. 계속할까요?')) return;
  const b = document.getElementById('adBtn');
  const requestedName = name;
  b.disabled = true; b.textContent = '감지 중... (엔진 상태에 따라 수 분)';
  try {
    const r = await apiFetch('/api/templates/' + encodeURIComponent(name) + '/autodetect', { method: 'POST' });
    if (name !== requestedName) return;
    if (!r.ok) { notify((await r.json()).detail || '감지 실패'); return; }
    fields = (await r.json()).fields;
    renderFields();
  } finally { b.disabled = false; b.textContent = '✨ 자동 필드 감지 (베타)'; }
}

async function saveTpl() {
  // 저장 시 candidates 타입인데 후보가 비면 text로 강등하지 않고 그대로 저장(엔진이 무시)
  const savingName = name, content = JSON.stringify(templateContents());
  const r = await apiFetch('/api/templates/' + encodeURIComponent(savingName), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: content
  });
  if (JSON.stringify(viewState.read('templateDraft:' + savingName)) === content) viewState.remove('templateDraft:' + savingName);
  if (name !== savingName) return;
  templateBaseline = content;
  if (JSON.stringify(templateContents()) !== content) { storeTemplateDraft(); return; }
  document.getElementById('discardDraft').hidden = true; draftStored = true;
  document.getElementById('saved').textContent = r.ok
    ? '저장됨 ' + new Date().toLocaleTimeString()
    : '⚠ ' + (await r.json()).detail;
}

async function delTpl() {
  if (!name || !confirm(name + ' 템플릿을 삭제할까요?')) return;
  await apiFetch('/api/templates/' + encodeURIComponent(name), { method: 'DELETE' });
  viewState.remove('templateDraft:' + name); viewState.remove('templateLast'); templateReady = false;
  location.href = 'template.html';
}

loadList();
</script>
</body>
</html>
