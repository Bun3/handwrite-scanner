<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검수 - handwrite-scanner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><b>handwrite-scanner</b>
  <a href="/">작업</a><a href="template.html">템플릿</a>
</header>
<main>
<div class="card">
  <h3 id="title">검수</h3>
  <div style="margin-bottom:10px">
    <span class="hint">문서 필터:</span>
    <select id="pageField" onchange="applyFilter()"><option value="">(필드 선택)</option></select>
    <input id="pageValue" placeholder="값 (부분일치)" oninput="applyFilter()" style="width:150px">
    &nbsp; <span class="hint">표시 필드:</span>
    <select id="fieldFilter" onchange="applyFilter()"><option value="">(모든 필드)</option></select>
    <div class="hint">문서 필터는 값이 일치하는 문서만 남기고(전체 필드 표시), 표시 필드는 고른 필드 행만 보여줍니다 — 표 내보내기에도 동일하게 적용됩니다</div>
  </div>
  <div id="alignWarn" class="warn" style="display:none">
    ⚠ 템플릿 정합에 실패해 단순 크기 맞춤으로 처리했습니다. 결과를 꼼꼼히 확인하세요.
  </div>
  <div id="list"></div>
  <br>
  <button onclick="preview('searchable')">미리보기</button>
  <button onclick="pdf('searchable')">PDF 다운로드 (원본+텍스트층)</button>
  <!-- 깔끔한 문서(kind=clean)는 수요가 적어 버튼 숨김 — API로는 ?kind=clean 지원 유지 -->
  <!-- 인라인 onclick에서 ${id}는 버튼 자신의 DOM id(빈 값)를 잡는다 — 반드시 함수 경유 -->
  <button class="secondary" onclick="original()">원본 다운로드</button>
  <select id="expFmt">
    <option value="md">Markdown (.md)</option>
    <option value="txt">텍스트 (.txt)</option>
    <option value="csv">CSV (.csv)</option>
  </select>
  <label class="hint" style="white-space:nowrap"><input type="checkbox" id="expOnly">
    표시 필드 컬럼만</label>
  <button class="secondary" onclick="exportFile()">표 내보내기</button>
</div>
</main>
<script>
const id = new URLSearchParams(location.search).get('id');
document.getElementById('title').textContent = '검수 — ' + id;

async function load() {
  const d = await (await fetch('/api/jobs/' + id)).json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const page of d.results) {
    if (page.aligned === false) document.getElementById('alignWarn').style.display = '';
    const pageImg = new Image();
    pageImg.src = `/api/jobs/${id}/page/${page.page}`;
    await new Promise(r => pageImg.onload = r);
    const h = document.createElement('h4');
    h.dataset.page = page.page;
    h.textContent = `${page.page + 1} 페이지 — ` +
      (page.skipped ? '건너뜀 (지정 양식과 다른 서류)' :
       page.template ? `양식: ${page.template}` : '양식 자동 인식 안 됨 (템플릿 없이 추출)');
    const view = document.createElement('a');
    view.href = `/api/jobs/${id}/page/${page.page}`;
    view.target = '_blank';
    view.textContent = '원본 보기';
    view.style.cssText = 'margin-left:10px;font-size:13px;font-weight:400';
    h.appendChild(view);
    list.appendChild(h);
    for (const w of page.warnings || []) {
      const div = document.createElement('div');
      div.className = 'warn';
      div.dataset.page = page.page;
      div.textContent = '⚠ ' + w;
      list.appendChild(div);
    }
    for (const f of page.fields) {
      const row = document.createElement('div');
      row.className = 'field-row ' + confClass(f.confidence);
      row.dataset.label = f.label;
      row.dataset.page = page.page;
      row.dataset.value = f.value || '';
      addFilterOption(f.label);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = f.label + (f.confidence < 0.7 ? ' ⚠' : '');
      row.appendChild(label);
      if (f.box) {
        const [x, y, w, hh] = f.box, pad = Math.max(8, pageImg.width / 100 | 0);
        const c = document.createElement('canvas');
        const cw = Math.min(w + pad * 2, pageImg.width - x + pad), ch = hh + pad * 2;
        c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(pageImg, x - pad, y - pad, cw, ch, 0, 0, cw, ch);
        if (cw > 340) c.style.width = '340px';
        row.appendChild(c);
      }
      const inp = document.createElement('input');
      inp.value = f.value || '';
      inp.title = 'LLM 원문: ' + (f.raw || '');
      inp.onchange = async () => {
        const r = await (await fetch(`/api/jobs/${id}/fields`, { method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page: page.page, id: f.id, value: inp.value }) })).json();
        row.className = 'field-row c-green';   // 사람이 확인한 값 = 100%
        row.dataset.value = inp.value;         // 값 필터가 수정된 값을 반영하도록
        label.textContent = f.label;
        conf.textContent = '100%';
        if (r.suggest) {           // 후보목록 학습 제안
          const s = r.suggest, btn = document.createElement('button');
          btn.className = 'secondary';
          btn.textContent = `후보목록에 '${s.value}' 추가`;
          btn.onclick = async () => {
            await fetch(`/api/templates/${encodeURIComponent(s.template)}/candidates`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ field_id: s.field_id, value: s.value }) });
            btn.replaceWith(Object.assign(document.createElement('span'),
              { className: 'hint', textContent: '✓ 추가됨' }));
          };
          row.querySelector('button')?.remove();
          row.appendChild(btn);
        }
      };
      row.appendChild(inp);
      const conf = document.createElement('span');
      conf.className = 'conf hint';
      conf.textContent = (f.confidence * 100).toFixed(0) + '%';
      row.appendChild(conf);
      if (!f.value && f.confidence <= 0.5) {  // 모델이 빈칸/무표시라 답함 — 사람이 판단
        const note = document.createElement('span');
        note.className = 'hint';
        note.style.color = 'var(--bad, #c0392b)';
        note.textContent = f.type === 'circle'
          ? '✋ 표시 없음으로 인식됨 — 원본을 보고 직접 선택하세요'
          : '✋ 빈칸으로 인식됨 — 원본을 확인하세요';
        row.appendChild(note);
      }
      list.appendChild(row);
    }
    // 로딩 중에 필터를 걸어도 이후 추가되는 페이지까지 일관 적용
    if (filterValue() || pageFilter().field) applyFilter();
  }
}

const filterValue = () => document.getElementById('fieldFilter').value;      // 표시 필드
const pageFilter = () => ({ field: document.getElementById('pageField').value,
                            value: document.getElementById('pageValue').value.trim() });

function addFilterOption(label) {
  for (const id of ['fieldFilter', 'pageField']) {
    const sel = document.getElementById(id);
    if (![...sel.options].some(o => o.value === label)) sel.add(new Option(label, label));
  }
}

function applyFilter() {
  const disp = filterValue();
  const pf = pageFilter();
  let pages = null;  // null = 전체 문서
  if (pf.field && pf.value) {  // 문서 필터: 해당 필드 값이 부분일치하는 문서만
    pages = new Set();
    const v = pf.value.toLowerCase();
    document.querySelectorAll('.field-row').forEach(r => {
      if (r.dataset.label === pf.field && (r.dataset.value || '').toLowerCase().includes(v))
        pages.add(r.dataset.page);
    });
  }
  document.querySelectorAll('.field-row').forEach(r =>
    r.style.display = ((!disp || r.dataset.label === disp)
                       && (!pages || pages.has(r.dataset.page))) ? '' : 'none');
  document.querySelectorAll('h4').forEach(h =>
    h.style.display = (!pages || pages.has(h.dataset.page)) ? '' : 'none');
  document.querySelectorAll('.warn').forEach(w => {
    if (w.id === 'alignWarn') return;
    // 표시 필드로 좁힌 동안엔 페이지 경고 숨김, 문서 필터는 숨긴 문서 것만 숨김
    w.style.display = (disp || (pages && !pages.has(w.dataset.page))) ? 'none' : '';
  });
}

function confClass(c) {
  if (c >= 1) return 'c-green';
  if (c <= 0.5) return 'c-red';
  return c <= 0.75 ? 'c-orange' : 'c-yellow';
}

function pdf(kind) { location.href = `/api/jobs/${id}/pdf?kind=${kind}`; }
function original() { location.href = `/api/jobs/${id}/original`; }
function preview(kind) { window.open(`/api/jobs/${id}/pdf?kind=${kind}&inline=1`); }
function exportFile() {
  let url = `/api/jobs/${id}/export?fmt=${document.getElementById('expFmt').value}`;
  const pf = pageFilter();
  if (pf.field && pf.value)   // 문서 필터 → 행
    url += `&field=${encodeURIComponent(pf.field)}&value=${encodeURIComponent(pf.value)}`;
  if (filterValue() && document.getElementById('expOnly').checked)  // 표시 필드 → 컬럼
    url += `&col=${encodeURIComponent(filterValue())}`;
  location.href = url;
}
load();
</script>
</body>
</html>
